<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/style.css">
  <title>Оно тебе надо — аукцион вещей, в которые никто не верил</title>
</head>
<body>
<header class="header">
  <nav class="menu">
    <ul class="menu__list">
      <li class="menu__item menu__item_no-dot"><a class="menu__link menu__link_active" href="./" aria-current="page"></a></li>
      <li class="menu__item"><a class="menu__link" href="#lots"></a></li>
      <li class="menu__item"><a class="menu__link" href="#about"></a></li>
    </ul>
  </nav>
  <a class="logo">
    <img class="logo__img" src="images/logo-black.svg" alt="Логотип «Оно тебе надо»">
  </a>
  <address class="address address_right">
    <a class="address__link" href="tel:+99995555555"></a>
    <a class="address__link" href="mailto:info@sobaka.ge"></a>
    <p class="address__text"></p>
  </address>
</header>

<main>
  <section class="cover">
    <div class="overlay"></div>
    <h1 class="cover__title">
      <span class="line line_left"></span>
      <span class="line line_center"></span>
      <span class="line line_right"></span>
    </h1>
    <div class="cover__bottom">
      <p class="cover__text"></p>
      <button class="button" type="button"></button>
    </div>
  </section>

  <section class="lots" id="lots">
    <h2 class="lots__title"></h2>
    <ul class="lots__list">
      <li class="lots__item">
        <a class="card" href="#">
          <article class="card__body card__body_film">
            <div class="overlay"></div>
            <h3 class="card__title"></h3>
            <p class="card__text"></p>
          </article>
        </a>
      </li>
      <li class="lots__item">
        <a class="card" href="#">
          <article class="card__body card__body_book">
            <div class="overlay"></div>
            <h3 class="card__title"></h3>
            <p class="card__text"></p>
          </article>
        </a>
      </li>
      <li class="lots__item">
        <a class="card" href="#">
          <article class="card__body card__body_picture">
            <div class="overlay"></div>
            <h3 class="card__title"></h3>
            <p class="card__text"></p>
          </article>
        </a>
      </li>
    </ul>
    <a class="lots__more" href="#"></a>
  </section>

  <section class="about" id="about">
    <div class="about__col">
      <div class="about__logo">
        <img class="about__logo-img" src="images/logo-white.svg" alt="">
      </div>
    </div>
    <div class="about__col">
      <h2 class="about__title"></h2>
      <div class="about__text">
        <p></p>
        <p></p>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <address class="address">
    <a class="address__link" href="tel:+99995555555"></a>
    <a class="address__link" href="mailto:info@sobaka.ge"></a>
    <p class="address__text"></p>
  </address>
  <nav class="footer__menu">
    <ul class="footer__list">
      <li class="footer__item"><a class="footer__link footer__link_active" href="./" aria-current="page"></a></li>
      <li class="footer__item"><a class="footer__link" href="#lots"></a></li>
      <li class="footer__item"><a class="footer__link" href="#about"></a></li>
    </ul>
  </nav>
  <ul class="social">
    <li class="social__item">
      <a class="social__link" href="https://www.youtube.com" target="_blank" rel="noopener">
        <img class="social__icon" src="images/yt.svg" alt="YouTube">
      </a>
    </li>
    <li class="social__item">
      <a class="social__link" href="https://vk.com" target="_blank" rel="noopener">
        <img class="social__icon" src="images/vk.svg" alt="ВКонтакте">
      </a>
    </li>
    <li class="social__item">
      <a class="social__link" href="https://www.pinterest.com" target="_blank" rel="noopener">
        <img class="social__icon" src="images/pinterest.svg" alt="Pinterest">
      </a>
    </li>
  </ul>
</footer>
</body>
</html>
